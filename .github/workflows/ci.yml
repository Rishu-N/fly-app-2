name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: PlannerCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: PlannerCore
        run: swift test 2>&1 | tail -60

  ios:
    name: iOS build + UI tests (simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: PlannerCore tests (macOS — exercises the Darwin networking paths)
        working-directory: PlannerCore
        run: swift test 2>&1 | tail -40

      - name: Pick simulator
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for rt in sorted([k for k in d if "iOS" in k], key=ver, reverse=True):
              phones = [x for x in d[rt] if x["name"].startswith("iPhone")]
              pro = [x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
              pick = (pro or phones)
              if pick:
                  print(pick[0]["udid"]); break
          ')
          echo "Using simulator $ID"
          xcrun simctl list devices | grep "$ID" || true
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build app + widget extension
        run: |
          set -o pipefail
          xcodebuild -project Dayflight.xcodeproj -scheme Dayflight \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build.log || { echo "---- errors ----"; grep -E "error:" build.log | sort -u | head -80; exit 1; }

      - name: Run UI tests (screenshots)
        run: |
          set -o pipefail
          xcodebuild -project Dayflight.xcodeproj -scheme Dayflight \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee test.log | grep -E "Test Case|error:|failed|passed|\*\* " | tail -80

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          fi
          ls -la screenshots | head -60

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
